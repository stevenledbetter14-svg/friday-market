<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0e15">
<title>Friday Market</title>
<style>
/* Look borrowed from the training log: dark "paper", system font stack, photo hero, glass tiles, photo bands. */
:root{--paper:#0d0e15;--card:#171a26;--card2:#12141f;--line:#262a3d;--tx:#eef0f8;--mut:#8b90a8;--soft:#c9cde0;
  --sun1:#ff9a3d;--sun2:#ff5e62;--sea:#39a0b8;--gold:#f0b429;--trail:#7fc36a;
  --up:#7fc36a;--dn:#ff8f6b;--up-rgb:127,195,106;--dn-rgb:255,94,98;
  --upbg:rgba(127,195,106,.16);--dnbg:rgba(255,94,98,.16);--flatbg:rgba(201,205,224,.09);
  --acc:var(--sea);--amb:var(--gold);--barh:124px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--tx);font:18px/1.55 -apple-system,BlinkMacSystemFont,"Avenir Next","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
main{padding:var(--barh) 0 48px}
h1{font-size:22px;font-weight:900;letter-spacing:-.01em;margin:0;line-height:1.2}
h2{font-size:26px;font-weight:850;letter-spacing:-.01em;line-height:1.2;color:#fff;margin:0 0 16px}
a{color:var(--sea)}

/* top bar: fixed glass over the hero */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(13,14,21,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.1);padding:10px 18px 6px}
.bar>div{max-width:604px;margin:0 auto}
.bar .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#when{font-size:16px;color:var(--soft);text-align:right}
#nav{font-size:15px;color:var(--mut)}
.bar input{display:block;width:100%;height:44px;margin:2px 0 0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.bar input:disabled{opacity:.45;cursor:default}
.bar input::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--sea),var(--sun1),var(--sun2))}
.bar input::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--sea),var(--sun1),var(--sun2))}
.bar input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:#fff;border:4px solid var(--sun1);box-shadow:0 2px 10px rgba(0,0,0,.5)}
.bar input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--sun1)}

.muted{color:var(--mut)}
.sm{font-size:15px;line-height:1.5}

/* hero: weather-matched sky with the Market Weather card over it */
.hero{position:relative;min-height:min(100vh,900px);min-height:min(100svh,900px);margin-top:calc(-1 * var(--barh));padding:calc(var(--barh) + 26px) 0 30px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,14,.55) 0%,rgba(8,9,14,.12) 26%,rgba(8,9,14,.55) 55%,rgba(13,14,21,.99) 100%)}
.herobody{position:relative;z-index:2;width:100%}
.eyebrow{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--sun1);font-weight:800;line-height:1.45;margin-bottom:12px;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.wx{display:flex;gap:14px;align-items:center}
.wx svg{flex:none;width:64px;height:64px;filter:drop-shadow(0 3px 12px rgba(0,0,0,.5))}
.verdict{font-size:52px;font-weight:900;line-height:1;letter-spacing:-.02em;text-transform:uppercase;text-shadow:0 4px 40px rgba(0,0,0,.6)}
.verdict em{font-style:normal;-webkit-background-clip:text;background-clip:text;color:transparent;background-image:linear-gradient(90deg,var(--soft),#fff)}
.verdict.sunny em{background-image:linear-gradient(90deg,var(--gold),var(--sun1))}
.verdict.stormy em{background-image:linear-gradient(90deg,var(--sun1),var(--sun2))}
.reason{font-size:19px;line-height:1.5;color:#e4e8f6;margin:14px 0 20px;text-shadow:0 1px 14px rgba(0,0,0,.7)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:16px;padding:14px 14px 12px;min-width:0;border:1px solid var(--line)}
.hero .tile{background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-color:rgba(255,255,255,.16)}
.hero .tile.up{background:rgba(var(--up-rgb),.16);border-color:rgba(var(--up-rgb),.4)}
.hero .tile.dn{background:rgba(var(--dn-rgb),.16);border-color:rgba(var(--dn-rgb),.4)}
.tile .k{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
.tile .v{font-size:28px;font-weight:850;letter-spacing:-.02em;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .c{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.hero .note{margin:14px 2px 0;color:#b9c0da}
.up{background:var(--upbg)}.dn{background:var(--dnbg)}.flat{background:var(--flatbg)}
.tu{color:var(--up)}.td{color:var(--dn)}.tf{color:var(--soft)}

/* cards + photo bands */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 20px;margin:0 0 26px}
.band{position:relative;border-radius:22px;overflow:hidden;height:230px;display:flex;align-items:flex-end;margin:6px 0 16px}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,14,.15),rgba(8,9,14,.92))}
.bandbody{position:relative;z-index:2;padding:20px 22px;width:100%}
.bandbody h3{font-size:26px;font-weight:870;letter-spacing:-.01em;line-height:1.2;margin:0}
.bandbody p{font-size:17px;color:#cfd5ea;margin:6px 0 0;line-height:1.5}

.heat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.heat .tile{padding:14px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;border-color:transparent}
.heat .n{font-size:17px;font-weight:650;line-height:1.3}
.heat .c{font-size:26px;font-weight:850;letter-spacing:-.01em;margin-top:6px}
.scale{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:15px;color:var(--mut)}
.scale i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(var(--dn-rgb),.9),var(--flatbg),rgba(var(--up-rgb),.9))}

ul.take{margin:0;padding:0;list-style:none}
ul.take li{background:#1a1712;border-left:4px solid var(--sun1);border-radius:0 14px 14px 0;padding:16px 18px;margin-bottom:14px;font-size:18px;line-height:1.6;color:#e4e8f6}
ul.take li:last-child{margin-bottom:0}
ul.take b{display:block;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--sun1);margin-bottom:6px}

.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:0 20px 8px;margin:0 -20px;-webkit-overflow-scrolling:touch}
.chip{flex:none;width:286px;scroll-snap-align:start;background:var(--card2);border:1px solid var(--line);border-left:5px solid var(--mut);border-radius:16px;padding:16px;font-size:17px;line-height:1.5}
.chip .d{font-size:15px;font-weight:800;color:var(--soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.chip .t{font-size:19px;font-weight:800;line-height:1.3;margin-bottom:6px}
.chip .y{font-weight:800}
.chip .sm{color:var(--soft);margin-top:6px}
.chip.earnings{border-left-color:var(--sea)}.chip.earnings .y{color:var(--sea)}
.chip.fed{border-left-color:var(--gold)}.chip.fed .y{color:var(--gold)}
.chip.econ{border-left-color:var(--trail)}.chip.econ .y{color:var(--trail)}
.chip.other .y{color:var(--mut)}
.tk{font-size:15px;color:var(--mut);font-family:ui-monospace,Menlo,monospace}

table{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
th,td{padding:12px 3px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td:first-child{color:#fff;font-weight:600}
th{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.big{font-size:44px;font-weight:900;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
.two h2{font-size:20px;margin-bottom:8px}
.mv{display:flex;justify-content:space-between;font-size:18px;padding:6px 0;font-variant-numeric:tabular-nums}

.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-bottom:18px}
.counts div{border-radius:16px;padding:12px 0 10px;background:var(--card2);border:1px solid var(--line)}
.counts b{display:block;font-size:32px;font-weight:900;line-height:1.1;margin-bottom:6px}
.counts .badge{margin:0}
.rate{font-size:18px;margin-bottom:14px}
.rate b{font-size:32px;font-weight:900;color:var(--sun1);margin-left:4px}
.call{padding:18px 0;border-top:1px solid var(--line);font-size:18px;line-height:1.5}
.call>.sm{margin-top:6px}
.badge{display:inline-block;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:20px;margin-right:8px;vertical-align:2px}
.b-open{background:#1e2b31;color:#6fc3d8}.b-hit{background:var(--upbg);color:var(--up)}.b-miss{background:var(--dnbg);color:var(--dn)}.b-mixed{background:#33280e;color:var(--gold)}
.err{color:var(--dn);font-size:18px}
.src{position:relative;font-size:13px;font-weight:700;line-height:0;vertical-align:super;margin-left:3px;color:var(--sea);text-decoration:none;letter-spacing:0;text-transform:none}
a.src::after{content:"";position:absolute;left:-19px;right:-19px;top:-22px;bottom:-22px}
span.src{color:var(--mut)}
h2 .src{font-size:15px}
.cm{font-size:16px;color:var(--mut);margin-top:4px}
.cm b{color:var(--tx);font-weight:700}
.banner{background:var(--dnbg);border:2px solid var(--dn);border-radius:22px;padding:24px 20px;margin:24px 0}
.banner h2{color:var(--dn);font-size:26px;margin-bottom:10px}
.banner p{margin:0 0 10px;font-size:19px;font-weight:700}
.banner ul{margin:10px 0 0;padding-left:20px;font-size:16px;color:var(--soft)}
.status{padding-top:24px}
</style>

</head>
<body>
<header class="bar"><div>
  <div class="row"><h1>Friday Market</h1><span id="when" class="muted sm"></span></div>
  <input id="slider" type="range" min="0" max="0" value="0" step="1" aria-label="Archive: choose a Friday" disabled>
  <div id="nav" class="row"><span id="first"></span><span id="count"></span><span id="last"></span></div>
</div></header>
<main id="app"><div class="wrap status"><p class="muted">Loading…</p></div></main>
<script>
(function () {
  'use strict';
  var EM = '—', MINUS = '−';
  var EXTRA = []; // optional extra cards rendered after the weather card
  var EXPECTED = '1.1'; // injected by build.py from schema.json

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function nf(a, b) { return new Intl.NumberFormat('en-US', { minimumFractionDigits: a, maximumFractionDigits: b }); }
  var F2 = nf(2, 2), FP = nf(1, 2), FY = nf(2, 3), FB = nf(0, 1);
  function signed(v, s) { return (v > 0 ? '+' : v < 0 ? MINUS : '') + s; }
  function pct(v) { return isNum(v) ? signed(v, FP.format(Math.abs(v))) + '%' : EM; }
  function pts(v) { return isNum(v) ? signed(v, FP.format(Math.abs(v))) + ' pts' : EM; }
  function bp(v) { return isNum(v) ? signed(v, FB.format(Math.abs(v))) + ' bp' : EM; }
  function num(v) { return isNum(v) ? F2.format(v) : EM; }
  function usd(v, sgn) { return isNum(v) ? (v < 0 ? MINUS : sgn && v > 0 ? '+' : '') + '$' + F2.format(Math.abs(v)) : EM; }
  function tone(v) { return !isNum(v) || v === 0 ? 'flat' : v > 0 ? 'up' : 'dn'; }
  function ttone(v) { return { flat: 'tf', up: 'tu', dn: 'td' }[tone(v)]; }

  var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function pd(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }
  function dLong(s) { var d = pd(s); return d ? DOW[d.getDay()] + ' ' + MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() : String(s); }
  function dShort(s) { var d = pd(s); return d ? DOW[d.getDay()] + ' ' + MON[d.getMonth()] + ' ' + d.getDate() : String(s); }

  // Source tag: superscript [n] (n = position in sources[]); a link when url is set, plain tag when url is null.
  function srcTag(d, id) {
    if (!id) return '';
    var list = d.sources || [], i = -1;
    for (var k = 0; k < list.length; k++) if (list[k] && list[k].id === id) { i = k; break; }
    if (i < 0) return '';
    var s = list[i], t = 'title="' + esc(s.label || id) + '"', n = esc(i + 1);
    return /^https?:\/\//.test(s.url || '') ? '<a class="src" href="' + esc(s.url) + '" target="_blank" rel="noopener" ' + t + '>' + n + '</a>'
      : '<span class="src" ' + t + '>' + n + '</span>';
  }
  // One tag for a whole section when every item shares a source; otherwise '' (items get their own tags).
  function sharedSrc(d, items) {
    var ids = (items || []).map(function (x) { return x && x.source; });
    return ids.length && ids.every(function (x) { return x === ids[0]; }) ? srcTag(d, ids[0]) : '';
  }

  function tile(label, value, change, v, tag) {
    return '<div class="tile ' + tone(v) + '"><div class="k">' + esc(label) + (tag || '') + '</div><div class="v">' + esc(value) +
      '</div><div class="c ' + ttone(v) + '">' + esc(change) + '</div></div>';
  }

  var ICONS = {
    sunny: '<svg viewBox="0 0 56 56" aria-hidden="true"><g stroke="#f2b33d" stroke-width="3" stroke-linecap="round"><path d="M28 4v6M28 46v6M4 28h6M46 28h6M11 11l4 4M41 41l4 4M11 45l4-4M41 15l4-4"/></g><circle cx="28" cy="28" r="11" fill="#f2b33d"/></svg>',
    cloudy: '<svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="20" cy="20" r="8" fill="#f2b33d"/><path d="M16 42h26a9 9 0 0 0 0-18 12 12 0 0 0-23 3 8 8 0 0 0-3 15z" fill="#9aa4b1"/></svg>',
    stormy: '<svg viewBox="0 0 56 56" aria-hidden="true"><path d="M14 34h28a9 9 0 0 0 0-18 12 12 0 0 0-23 3 8 8 0 0 0-5 15z" fill="#6e7781"/><path d="M29 34l-6 10h6l-3 9 10-13h-6l4-6z" fill="#f2b33d"/></svg>'
  };

  function band(src, alt, title, text) {
    return '<div class="band"><img src="' + src + '" alt="' + esc(alt) + '"><div class="bandbody"><h3>' + esc(title) + '</h3><p>' +
      esc(text) + '</p></div></div>';

  var IDX = { 'S&P 500': 'S&P 500', 'Nasdaq Composite': 'Nasdaq', 'Dow Jones Industrial Average': 'Dow' };

  function weatherCard(d, eyebrow) {
    var w = d.weather || {}, m = d.market || {}, h = '';
    (m.indexes || []).forEach(function (i) { h += tile(IDX[i.name] || i.name, num(i.close), pct(i.weekly_pct), i.weekly_pct, srcTag(d, i.source)); });
    var y = m.us10y || {};
    h += tile('10-yr yield', isNum(y['yield']) ? FY.format(y['yield']) + '%' : EM, bp(y.weekly_bp), y.weekly_bp, srcTag(d, y.source));
    var o = m.oil || {};
    [['Brent', o.brent], ['WTI', o.wti]].forEach(function (p) {
      var x = p[1] || {};
      h += tile(p[0] + ' oil', usd(x.price), pct(x.weekly_pct), x.weekly_pct, srcTag(d, x.source));
    });
    var v = ICONS[w.verdict] ? w.verdict : null;
    return '<section class="hero" aria-label="Market weather"><img src="' + SKY[v || 'cloudy'] + '" alt="' + esc((v || 'cloudy') + ' sky') + '">' +
      '<div class="herobody wrap"><div class="eyebrow">' + eyebrow + '</div><div class="wx">' + (v ? ICONS[v] : '') +
      '<div class="verdict ' + esc(v || '') + '"><em>' + esc(v || EM) + '</em></div></div><p class="reason">' + esc(w.reason || EM) + '</p>' +
      '<div class="grid">' + h + '</div><p class="sm note">Weekly change, prior Friday close to this Friday close.</p></div></section>';
  }

  function sectorCard(d) {
    var s = (d.sectors || []).slice(), max = 1, shared = sharedSrc(d, s);
    s.forEach(function (x) { if (isNum(x.weekly_pct)) max = Math.max(max, Math.abs(x.weekly_pct)); });
    s.sort(function (a, b) { return (isNum(b.weekly_pct) ? b.weekly_pct : -1e9) - (isNum(a.weekly_pct) ? a.weekly_pct : -1e9); });
    var h = s.map(function (x) {
      var v = x.weekly_pct, bg = 'var(--flatbg)';
      if (isNum(v) && v !== 0) bg = 'rgba(var(--' + (v > 0 ? 'up' : 'dn') + '-rgb),' + (0.12 + 0.68 * Math.min(1, Math.abs(v) / max)).toFixed(2) + ')';
      return '<div class="tile" style="background:' + bg + '"><div class="n">' + esc(x.sector) + ' <span class="tk">' + esc(x.proxy) +
        '</span>' + (shared ? '' : srcTag(d, x.source)) + '</div><div class="c">' + esc(pct(v)) + '</div></div>';
    }).join('');
    return band(PIC.floor, 'Trading floor screens', 'Under the hood', 'Eleven sectors, one week: where the money rotated in and out.') +
      '<section class="card"><h2>Sectors this week' + shared + '</h2><div class="heat">' + h + '</div><div class="scale"><span>' +
      esc(pct(-max)) + '</span><i></i><span>' + esc(pct(max)) + '</span></div></section>';
  }

  function takeCard(d) {
    var t = d.take || {};
    var rows = [['What happened', t.what_happened], ['Why it matters', t.why_it_matters], ['What to watch', t.what_to_watch]];
    return '<section class="card"><h2>Charles’s take</h2><ul class="take">' + rows.map(function (r) {
      return '<li><b>' + esc(r[0]) + '</b>' + esc(r[1] || EM) + '</li>';
    }).join('') + '</ul></section>';
  }

  function calendarCard(d) {
    var items = (d.calendar || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var top = band(PIC.desk, 'Desk calendar', 'The week ahead', 'Earnings, the Fed and the data drops that can move the tape.');
    if (!items.length) return top + '<section class="card"><h2>Coming up</h2><p class="muted">No events listed.</p></section>';
    var h = items.map(function (it) {
      var ty = /^(earnings|fed|econ|other)$/.test(it.type) ? it.type : 'other';
      return '<div class="chip ' + ty + '"><div class="d">' + esc(dShort(it.date)) + ' \u00b7 <span class="y">' + esc(ty) + '</span></div>' +
        '<div class="t">' + esc(it.title) + '</div>' +
        (it.tickers && it.tickers.length ? '<div class="tk">' + esc(it.tickers.join(' \u00b7 ')) + '</div>' : '') +
        (it.why_it_matters ? '<div class="sm muted">' + esc(it.why_it_matters) + '</div>' : '') + '</div>';
    }).join('');
    return top + '<section class="card"><h2>Coming up</h2><div class="strip">' + h + '</div></section>';
  }

  // Scorecard: every call seen in the archive up to the selected Friday; the newest file containing an id wins.
  var FT = nf(0, 2);
  function target(v) { return isNum(v) ? FT.format(v) : typeof v === 'string' && v ? v : EM; }

  function scoreCard(dates, weeks, idx) {
    var byId = {}, files = 0;
    for (var i = 0; i <= idx; i++) {
      var cs = ((weeks[dates[i]] || {}).calls || []).filter(function (c) { return c && c.id; });
      if (cs.length) files++;
      cs.forEach(function (c) { byId[c.id] = c; });
    }
    var calls = Object.keys(byId).map(function (k) { return byId[k]; });
    calls.sort(function (a, b) { return a.id < b.id ? 1 : a.id > b.id ? -1 : 0; });
    var n = { open: 0, hit: 0, miss: 0, mixed: 0 };
    calls.forEach(function (c) { if (c.status in n) n[c.status]++; });
    var scored = n.hit + n.miss + n.mixed;
    var rate = scored ? FP.format((n.hit + 0.5 * n.mixed) / scored * 100) + '%' : EM;
    var h = '<section class="card"><h2>Calls scorecard</h2><div class="counts">' + ['open', 'hit', 'miss', 'mixed'].map(function (k) {
      return '<div><b>' + n[k] + '</b><span class="badge b-' + k + '">' + k + '</span></div>';
    }).join('') + '</div><div class="rate">Hit rate <b>' + esc(rate) + '</b><div class="sm muted">(hits + ½ × mixed) ÷ (hits + misses + mixed); ' +
      scored + ' scored, open calls excluded</div></div>';
    h += '<div class="sm muted" style="margin-bottom:6px">' + calls.length + ' unique call' + (calls.length === 1 ? '' : 's') + ' across ' +
      files + ' Friday file' + (files === 1 ? '' : 's') + ' with calls, through ' + esc(dShort(dates[idx])) + '. Latest status wins.</div>';
    h += calls.map(function (c) {
      var st = /^(open|hit|miss|mixed)$/.test(c.status) ? c.status : 'open';
      return '<div class="call"><span class="badge b-' + st + '">' + esc(st) + '</span>' + esc(c.call) +
        '<div class="cm">' + esc(c.metric || EM) + '</div>' +
        '<div class="cm"><b>' + esc(c.direction || EM) + '</b> · target <b>' + esc(target(c.target)) + '</b></div>' +
        '<div class="sm muted">Made ' + esc(dShort(c.made_on)) + ' · horizon ' + esc(dShort(c.horizon_date)) +
        (c.scored_on ? ' · scored ' + esc(dShort(c.scored_on)) : '') + '</div>' +
        (c.notes ? '<div class="sm">' + esc(c.notes) + '</div>' : '') + '</div>';
    }).join('');
    return h + '</section>';
  }

      scoreCard(S.dates, S.weeks, idx) + '</div>';

  // Every loaded week and the manifest must carry the schema version this app was built for.
  function versionProblems(data) {
    var bad = [], m = data.manifest;
    if (m && m.schema_version !== EXPECTED) bad.push(['manifest.json', m.schema_version]);
    data.dates.forEach(function (dt) {

      if (v !== EXPECTED) bad.push([dShort(dt) + ' file', v]);

  function banner(bad) {
    ['slider', 'nav'].forEach(function (id) { document.getElementById(id).hidden = true; });
    document.getElementById('when').textContent = '';
    var got = bad.map(function (b) { return b[1] === undefined ? 'none' : String(b[1]); })
      .filter(function (v, i, a) { return a.indexOf(v) === i; }).join(', ');
    console.warn('Friday Market: schema_version mismatch, expected ' + EXPECTED, bad);
    sizeBar();
    app.innerHTML = '<div class="wrap"><section class="banner" role="status" aria-live="assertive"><h2>⚠ Cannot show this data</h2><p>Data format changed (got ' + esc(got) +

  function start(data) {

    var idx = want >= 0 ? want : last;
    slider.max = String(last); slider.value = String(idx); slider.disabled = last === 0;
    document.getElementById('first').textContent = dShort(S.dates[0]).replace(/^\w+ /, '');
    document.getElementById('last').textContent = last ? dShort(S.dates[last]).replace(/^\w+ /, '') : '';
    document.getElementById('count').textContent = data.fallback ? 'latest only (archive unavailable)'
      : S.dates.length < total ? S.dates.length + ' of ' + total + ' Fridays loaded'
      : S.dates.length + ' Friday' + (last ? 's' : '') + ' in archive';
    slider.addEventListener('input', function () { render(+slider.value); });
    render(idx);
  }

  function getJSON(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(url + ': HTTP ' + r.status);
      return r.json();
    });
  }

  if (window.FM_DATA) {
    start(window.FM_DATA);
  } else {
    // data/manifest.json: {"schema_version","latest","files":[{"date","file"}]} with file paths relative to data/.
    // An archive file that fails to load or parse is skipped (console warning, "N of M Fridays loaded").
    // If the manifest is missing or no archive file loads, show data/latest.json alone (slider disabled).
    var manifest = null;
    getJSON('data/manifest.json').then(function (m) {
      manifest = m && typeof m === 'object' ? m : null;
      var all = manifest && Array.isArray(m.files) ? m.files : [];
      var files = all.filter(function (f) {
        var ok = f && /^\d{4}-\d{2}-\d{2}$/.test(f.date) && /^archive\/\d{4}-\d{2}-\d{2}\.json$/.test(f.file);
        if (!ok) console.warn('Friday Market: skipping bad manifest entry', f);
        return ok;
      });
      if (!files.length) throw new Error('data/manifest.json lists no archive files');
      return Promise.all(files.map(function (f) {
        return getJSON('data/' + f.file).then(function (d) {
          if (!d || typeof d !== 'object' || !d.meta) throw new Error('not a Friday file');
          return d;
        }).catch(function (e) {
          console.warn('Friday Market: skipping data/' + f.file + ' (' + e.message + ')');
          return null;
        });
      })).then(function (list) {
        var weeks = {}, dates = [];
        files.forEach(function (f, i) { if (list[i]) { weeks[f.date] = list[i]; dates.push(f.date); } });
        if (!dates.length) throw new Error('none of the ' + files.length + ' archive files loaded');
        return { manifest: manifest, dates: dates, weeks: weeks, total: all.length };
      });
    }).catch(function (e) {
      console.warn('Friday Market: archive unavailable (' + e.message + '); falling back to data/latest.json');
      return getJSON('data/latest.json').then(function (d) {
        var dt = (d && d.meta && d.meta.date) || 'latest', weeks = {};
        weeks[dt] = d;
        return { manifest: manifest, dates: [dt], weeks: weeks, fallback: true };
      });
    }).then(start, function (e) {
      app.innerHTML = '<div class="wrap status"><p class="err">Could not load data: ' + esc(e.message) + '</p></div>';
    });
  }
})();
</script>
</body>
</html>
